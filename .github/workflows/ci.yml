name: CI

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is
# mutable: whoever controls the action repository can repoint it, and these
# workflows would then run that code with the permissions granted below. The
# trailing comment records which release each SHA corresponds to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info roughly doubles compile time and target size, and nothing in CI
  # reads a backtrace symbol table.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    # Kova Screen is Windows-only: every crate below the app calls Win32 or
    # WinRT, so there is nothing meaningful to check on another runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # rust-toolchain.toml selects the version; this only adds the components.
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # GitHub's Windows runners have no attached display, so the tests that
        # need real pixels detect that and skip themselves with a printed
        # reason. Everything else -- geometry, encoders, parsing, storage,
        # secret handling -- runs here for real.
        # Native overlay tests measure process-wide GDI/USER counts and share
        # window classes, so keep their resource lifetimes separate.
        run: cargo test --workspace -- --nocapture --test-threads=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      - name: Type check
        run: npm run lint
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

  bundle:
    name: Installer
    runs-on: windows-latest
    # A broken installer is only interesting once the code itself is sound.
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bundle

      - run: npm ci
        working-directory: ui

      - name: Build the installer
        # Verifies the bundle step works on every PR, so a release tag is never
        # the first time the installer is built.
        run: npx --yes @tauri-apps/cli@2 build --config apps/kova-screen/tauri.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: kova-screen-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
